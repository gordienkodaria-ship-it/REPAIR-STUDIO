{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Repair Studio{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'workshop/css/style.css' %}">
</head>

<body>

    <header class="site-header">
        <div class="container header-content">

            <a href="{% url 'dashboard' %}" class="logo">
                REPAIR<span>STUDIO</span>
            </a>

            <nav class="main-nav">
                <a href="{% url 'home' %}">Главная</a>
                <a href="{% url 'home' %}#services">Услуги</a>
                <a href="{% url 'home' %}#about-workshop">О мастерской</a>
                <a href="{% url 'home' %}#contacts">Контакты</a>
            </nav>

            <div class="header-actions">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="header-account">
                        Личный кабинет
                    </a>
                {% else %}
                    <a href="{% url 'login' %}" class="header-account">
                        Войти
                    </a>
                {% endif %}
            </div>

        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 Repair Studio. Все права защищены.</p>
            <p>Профессиональный ремонт техники</p>
        </div>
    </footer>

</body>
</html>
